investigations:
  DXY-GAPS-2026-09-14:
    finding: 'DXY CFD (Dukascopy DOLLARIDXUSD) minutes with no quotes outside the 17:00-18:00 New York break. On the Oct 20-24 and Nov 11 fixture
      days, 88-97% of those minutes are also absent from DX futures (no trades), with DX median volume 1-2 contracts in the few minutes where
      DX did trade. The 60-minute blocks at 23:00-00:59 UTC on 2025-11-09/10/11 match the CFD''s daily quoting start at 20:00 New York: on 2025-11-11
      DX futures also started 01:00 UTC (20:00 EST); in October (EDT) 20:00 New York = 00:00 UTC, so no block appears. On the weekly reopen (Sun
      2025-11-09 → Mon 11-10) DX futures open at 18:00 New York (23:00 UTC) while the CFD waits until 20:00 New York, which explains the 68 minutes
      on 2025-11-10 when DX traded and the CFD did not.

      '
    evidence: investigation run 2026-09-14 (DX session first/last bars; CFD-missing vs DX-missing counts per day)
    downstream_limitation: 'DXY CFD has no bars in thin minutes and none between 18:00 and 20:00 New York on Sunday reopen. DXY context features
      must treat these as missing (lower confidence), never forward-filled, and the DXY module (Phase 10) must not require DXY bars in the first
      two hours after the weekly reopen.

      '
  DXY-1M-CORR-2026-09-14:
    finding: 'DXY CFD vs DX front-month 1m return correlation 0.745-0.900 (pre-declared threshold 0.90) on 7 fixture days, with best lag 0 on
      every day, basis mean -0.0003 to -0.0005 (std ~0.004) and price-scale deviation 0.003%. Correlation rises with horizon: 5m 0.891-0.966,
      15m 0.963-0.983. Restricting to minutes with >=3 or >=5 CFD ticks does not raise it (0.66-0.86), so CFD staleness is not the cause. DX futures
      itself has 23-30% exactly-zero 1m returns (0.005 tick size is comparable to a typical 1m move) vs 3% for the CFD: the disagreement is 1m
      quantization and thin trading in the futures reference, not a timestamp or scaling error in the pipeline.

      '
    evidence: investigation run 2026-09-14 (multi-horizon correlation, zero-return shares, tick-count-filtered correlation)
    downstream_limitation: 'DXY direction on 15m and 1h candles is well supported (15m correlation >= 0.96). DXY structure at 1m and 5s (Tom''s
      5-second DXY shifts, EP2-026) cannot be validated against DX futures; before any DXY feature at 1m/5s scale is used, it needs an independent
      reference (e.g. TradingView TVC:DXY export for fixture windows). Recorded for Phase 10 and OQ-24 (futures DX is a weak 1m substitute for
      the DXY index).

      '
  GOLD-1M-QUANT-2026-09-14:
    finding: On quiet sample days, XAUUSD vs GC 1m correlation < 0.95 while 5m 0.972-0.978 and 15m 0.989-0.991, lag 0. GC has 21-29% exactly-zero
      1m returns vs 0.5-3% for spot; in 2019 the mean |GC 1m move| ($0.12) is about one GC tick ($0.10). 1m quantization in the futures reference.
    downstream_limitation: Gold structure at 15m/1h agrees across feeds; 1m-scale agreement is limited by GC tick quantization in low-volatility
      regimes. Relevant to G2b (cross-feed signal agreement) and OQ-24.
  GOLD-QUIET-MINUTES-2026-09-14:
    finding: 'Dukascopy XAUUSD has no bar in a few extremely quiet minutes (16 minutes across 3 sample days: 9, 6 and 1) in which GC traded 1-31
      contracts with a $0.00-0.20 range (day median 71-97 contracts).'
    downstream_limitation: Such minutes are missing, not flat; engines must not forward-fill. The 1m swing/extension logic sees a gap of one minute
      at most.
  GOLD-BASIS-2020-06-17:
    finding: Intraday basis drift of ~$3.7 in London hours without spikes or lag. Attributed to 2020 EFP/basis volatility (contextual).
    downstream_limitation: Futures-based gold structure can diverge from spot by several dollars intraday in dislocated regimes; this is exactly
      what G2b must measure before futures data supports baselines.
  DXY-VENDOR-GAP-2020-03-09:
    finding: Dukascopy DOLLARIDXUSD has no ticks for 2020-03-09 20:00-20:59 UTC (empty source file) during active DX trading.
    downstream_limitation: 'DATA_ERROR. Proposed resolution for owner approval: treat as missing data under the existing rule (no forward-fill;
      DXY context unavailable → lower confidence), and add a pipeline flag marking any hour where the reference futures traded but the CFD has
      no ticks as VENDOR_GAP so it is excluded from DXY features by rule rather than by inspection.'
  CANDLE-MID-EXTREMES-2026-09-14:
    finding: 'Daily candle files give mid high/low as (bid_high+ask_high)/2 and (bid_low+ask_low)/2. The side extremes can come from different
      ticks, and a single wide-spread quote inflates them. Example: DOLLARIDXUSD 2018-01-17 02:10 UTC, one tick bid 88.735 / ask 90.496 (spread
      1.761) gives candle mid high 89.934 / low 89.097, while the tick-derived mid high/low is 89.616 / 89.416 (diff 0.3185). Open and close always
      match exactly (0.0 on all 10 tick windows). High/low within 0.05: XAUUSD 94-100% of minutes (max diff $0.425), DXY 98-100% (max 0.3185,
      2018 only).'
    evidence: tick-window vs candle reconciliation in reports/phase9-data-acceptance.md; raw ticks 2018-01-17 02:00-02:12 UTC
    classification_note: No acceptance criterion fails (AC-06 checks open/close), so there is no failure id. It is recorded as a pipeline-semantics
      concern, not reclassified after the fact and with no threshold changed.
    downstream_limitation: Candle mid high/low are an outer bound on true mid extremes. Swing/extreme detection and stop placement (Phase 10+)
      must either use tick-derived bars where they exist or treat candle mid extremes as bounds, and a spread-spike tick filter must be specified
      (pre-declared) before full history is built. Proposed for owner decision; not implemented.
