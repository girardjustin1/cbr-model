- id: AC-07/unexpected_gaps/dollaridxusd/2019-03-11
  class: UNEXPLAINED_FEED_DIFFERENCE
  explanation: '00:00-00:59 UTC (20:00 EDT Monday after the US clock change): CFD tick file empty while DX traded 31 minutes (190 contracts).
    The CFD''s 20:00 New York start explains every other Monday checked (winter Mondays 2021-02-01, 2023-11-06, 2025-11-10: no CFD ticks at 19:00
    EST; summer Monday 2020-03-09: 795 ticks at 20:00 EDT), but not this one. Vendor schedule lag after the DST change vs vendor outage cannot
    be distinguished. Other gaps that day (22:00-23:59 session close, thin minutes) are expected. OWNER RULING D12-2: kept UNEXPLAINED; no explanation
    is asserted. Interval MISSING under the same no-fill rules; setups requiring it are reduced-confidence or unavailable per the engine''s missing-data
    policy. DST-Monday diagnostic (OQ-27) approved, required before DXY availability assumptions are frozen. Rulings (D12-1/D12-2) do not resolve
    the defect: the interval stays MISSING and the exception stays in the register.'
  cause_status: UNKNOWN
  owner_ruling: D12-2
  handling: MISSING
  detector: DXY_CFD_MISSING_WHILE_DX_ACTIVE
  ruled_interval_utc:
  - '2019-03-11T00:00:00+00:00'
  - '2019-03-11T01:00:00+00:00'
